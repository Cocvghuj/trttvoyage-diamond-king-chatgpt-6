<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">The Diamond Legacy — Abu Taher and Diamond King</title>
  <desc id="desc">A luminous geometric diamond above the words A Human Vision. An AI Collaborator. One Journey. TRTT Voyage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11152D"/>
      <stop offset="1" stop-color="#25213C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0B0"/>
      <stop offset=".48" stop-color="#D6A542"/>
      <stop offset="1" stop-color="#B77991"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E98BAF"/>
      <stop offset="1" stop-color="#F6C6D8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="65" r="180" fill="#E98BAF" opacity=".07"/>
  <circle cx="180" cy="390" r="220" fill="#D6A542" opacity=".06"/>
  <path d="M0 350 Q300 285 600 350 T1200 340" fill="none" stroke="#D6A542" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(600 115)" filter="url(#glow)">
    <path d="M0 -76 L78 -22 L48 66 L-48 66 L-78 -22 Z" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M-78 -22 L0 -22 L78 -22 M-48 66 L0 -22 L48 66 M0 -76 L0 -22" fill="none" stroke="url(#pink)" stroke-width="3"/>
    <path d="M0 -76 L0 -22 L-48 66 L-78 -22 Z" fill="#E98BAF" opacity=".13"/>
    <path d="M0 -76 L78 -22 L48 66 L0 -22 Z" fill="#D6A542" opacity=".16"/>
  </g>
  <text x="600" y="245" fill="#FFFFFF" text-anchor="middle" font-family="Georgia,serif" font-size="47" letter-spacing="5">THE DIAMOND LEGACY</text>
  <text x="600" y="291" fill="url(#pink)" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" letter-spacing="3">A HUMAN VISION  ·  AN AI COLLABORATOR</text>
  <text x="600" y="337" fill="#FFFFFF" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="2">ABU TAHER × DIAMOND KING</text>
  <text x="600" y="389" fill="url(#gold)" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">ONE TEAM  ·  ONE VISION  ·  ONE JOURNEY</text>
</svg>